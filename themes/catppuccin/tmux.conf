# tmux colours for the catppuccin theme.
#
# Sourced by config/tmux/tmux.conf through the current-theme symlink, so switching
# themes restyles tmux along with everything else. Layout lives in tmux.conf; this
# file only says what things look like.

set -g status-style "fg=#cdd6f4,bg=#181824"
set -g status-left-style "fg=#89b4fa,bold"
set -g status-right-style "fg=#7f849c"

setw -g window-status-style "fg=#7f849c,bg=#181824"
setw -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
setw -g window-status-activity-style "fg=#f38ba8,bg=#181824"
setw -g window-status-bell-style "fg=#f38ba8,bg=#181824,bold"

# The dividers between panes: barely there until a pane is focused.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g display-panes-colour "#7f849c"
set -g display-panes-active-colour "#89b4fa"

# Messages and the command prompt. `fill=` repeats the background across the whole status
# line and is not optional: since tmux 3.7 a message is drawn as one format overlaying the
# status line rather than replacing it, so a style without fill paints only the text it has
# and leaves the window tabs showing through beside it -- `Session name: workcode  3 notes-`.
# tmux's own default carries fill=yellow for the same reason. Keep fill equal to bg.
set -g message-style "fg=#1e1e2e,bg=#89b4fa,bold,fill=#89b4fa"
set -g message-command-style "fg=#cdd6f4,bg=#181824,fill=#181824"

# Copy-mode selection and search hits.
set -g mode-style "fg=#1e1e2e,bg=#94e2d5"
setw -g copy-mode-match-style "fg=#1e1e2e,bg=#7f849c"
setw -g copy-mode-current-match-style "fg=#1e1e2e,bg=#94e2d5"

set -g clock-mode-colour "#89b4fa"
