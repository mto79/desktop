# tmux colours for the tokyo-night theme.
#
# Sourced by config/tmux/tmux.conf through the current-theme symlink, so switching
# themes restyles tmux along with everything else. Layout lives in tmux.conf; this
# file only says what things look like.

set -g status-style "fg=#c0caf5,bg=#11111b"
set -g status-left-style "fg=#7aa2f7,bold"
set -g status-right-style "fg=#565f89"

setw -g window-status-style "fg=#565f89,bg=#11111b"
setw -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"
setw -g window-status-activity-style "fg=#f7768e,bg=#11111b"
setw -g window-status-bell-style "fg=#f7768e,bg=#11111b,bold"

# The dividers between panes: barely there until a pane is focused.
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"

set -g message-style "fg=#1a1b26,bg=#7aa2f7,bold"
set -g message-command-style "fg=#c0caf5,bg=#11111b"

# Copy-mode selection and search hits.
set -g mode-style "fg=#1a1b26,bg=#7dcfff"
setw -g copy-mode-match-style "fg=#1a1b26,bg=#565f89"
setw -g copy-mode-current-match-style "fg=#1a1b26,bg=#7dcfff"

set -g clock-mode-colour "#7aa2f7"
