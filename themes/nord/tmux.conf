# tmux colours for the nord theme.
#
# Sourced by config/tmux/tmux.conf through the current-theme symlink, so switching
# themes restyles tmux along with everything else. Layout lives in tmux.conf; this
# file only says what things look like.

set -g status-style "fg=#d8dee9,bg=#3b4252"
set -g status-left-style "fg=#81a1c1,bold"
set -g status-right-style "fg=#4c566a"

setw -g window-status-style "fg=#4c566a,bg=#3b4252"
setw -g window-status-current-style "fg=#2e3440,bg=#81a1c1,bold"
setw -g window-status-activity-style "fg=#bf616a,bg=#3b4252"
setw -g window-status-bell-style "fg=#bf616a,bg=#3b4252,bold"

# A coding agent's mark on its tab (see config/tmux/tmux.conf): the urgent colour while it
# waits on you, the accent once it is done and not yet looked at.
set -g @agent-waiting-colour "#bf616a"
set -g @agent-done-colour "#81a1c1"

# The dividers between panes: barely there until a pane is focused.
set -g pane-border-style "fg=#434c5e"
set -g pane-active-border-style "fg=#81a1c1"
set -g display-panes-colour "#4c566a"
set -g display-panes-active-colour "#81a1c1"

# Messages and the command prompt. `fill=` repeats the background across the whole status
# line and is not optional: since tmux 3.7 a message is drawn as one format overlaying the
# status line rather than replacing it, so a style without fill paints only the text it has
# and leaves the window tabs showing through beside it -- `Session name: workcode  3 notes-`.
# tmux's own default carries fill=yellow for the same reason. Keep fill equal to bg.
set -g message-style "fg=#2e3440,bg=#81a1c1,bold,fill=#81a1c1"
set -g message-command-style "fg=#d8dee9,bg=#3b4252,fill=#3b4252"

# Copy-mode selection and search hits.
set -g mode-style "fg=#2e3440,bg=#88c0d0"
setw -g copy-mode-match-style "fg=#2e3440,bg=#4c566a"
setw -g copy-mode-current-match-style "fg=#2e3440,bg=#88c0d0"

set -g clock-mode-colour "#81a1c1"
