# Keep libcamera out of WirePlumber, the process that owns every audio device.
#
# The cameras actually used are USB webcams -- a Logitech C920 at home, a UGREEN 4K at
# work -- and PipeWire offers those through its V4L2 monitor, which stays on. libcamera
# is only needed for the built-in IPU6 sensor, and twice it has taken audio down with it:
# first by aborting on the NVIDIA GPU (see the old LIBCAMERA_SOFTISP_MODE drop-in), then
# by hanging in the kernel when the IPU6 got stuck suspending after a hub replug. A thread
# stuck there cannot be killed, so WirePlumber stopped noticing hotplug -- the hub's USB
# sound card never became a sink -- and could not even be restarted until a reboot.
#
# The built-in camera is no longer offered through PipeWire. Nothing here uses it.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
