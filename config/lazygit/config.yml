gui:
  nerdFontsVersion: "3"

customCommands:
  - key: 'C'
    context: 'files'
    description: 'AI commit message (Claude)'
    command: 'desktop-git-commit'
    output: terminal
  - key: 'N'
    context: 'localBranches'
    description: 'AI branch name (Claude)'
    command: 'desktop-git-branch "{{.Form.Desc}}" "{{.Form.Ticket}}"'
    output: terminal
    prompts:
      - type: input
        title: 'What is this branch for?'
        key: 'Desc'
      - type: input
        title: 'Jira ticket (e.g. teaminfra-123, leave empty to skip)'
        key: 'Ticket'
  - key: 'H'
    context: 'localBranches'
    description: 'Housekeeping — delete merged branches'
    command: 'desktop-git-housekeeping'
    output: terminal
