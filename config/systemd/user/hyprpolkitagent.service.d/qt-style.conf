# hyprpolkitagent draws its dialog in the org.hyprland.style Quick Controls style, from
# hyprland-qt-support. That plugin links against Qt's private API, which is tied to the
# exact Qt build: the copr's hyprland-qt-support-0.1.0-1 fails to load against Fedora
# 44's Qt 6.11.2 with an undefined Qt_6.11_PRIVATE_API symbol. The dialog then never
# draws, and anything asking polkit -- KeePassXC's Quick Unlock -- hangs until the request
# fails.
#
# The agent only sets its own style when this variable is empty, so naming a style Qt
# ships itself keeps the prompt working whatever hyprland-qt-support was built against.
[Service]
Environment=QT_QUICK_CONTROLS_STYLE=Fusion
