# https://builtin.com/articles/tmux-config

# Changing the Default Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable full mouse support.
set -g mouse on

# Blinking cursor in tmux
set -g cursor-style blinking-bar

# Increase History
set-option -g history-limit 5000

# Set Default Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Set Default SHELL
set-option -g default-shell /usr/bin/fish
set-option -g default-command /usr/bin/fish

# Zero-out escape time delay
set -s escape-time 0

# Don't exit from tmux when closing a session 
set -g detach-on-destroy off

# Status bar
set -g status on                 # Enable status bar
set -g status-position top       # Set status bar on top
set -g status-interval 5         # Update status bar every 5 seconds

# Layout. Colours live in the theme file sourced at the bottom of this config; what
# each field contains is the same whichever theme is active.
set -g status-left-length 30
set -g status-right-length 40
set -g status-left " #S "
set -g status-right " #{?client_prefix,^A ,}%H:%M  %d %b "
setw -g window-status-format " #I #W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format " #I #W#{?window_flags,#{window_flags}, } "
setw -g window-status-separator ""

# Focus events enabled for terminals that support them
set -g focus-events on
# Super useful when using "grouped sessions" and multi-monitor setup 
setw -g aggressive-resize on

# Jump to a Marked Pane
bind \` switch-client -t'{marked}'

# Numbering Windows and Panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Intuitive Split Commands
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

# Swapping windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Binding for new custom session
bind-key n command-prompt -p "Session name:" "new-session -s '%%'"
# Binding for new window keeping current path
bind c new-window -c "#{pane_current_path}"

# Toggling Windows and Sessions
bind Space last-window
bind-key C-Space switch-client -l
bind -n C-Left previous-window
bind -n C-Right next-window

# Resizing
bind -r C-j resize-pane -D 15
bind -r C-k resize-pane -U 15
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

# Breaking and Joining Panes
bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -s "%%"'

# Quick Pane Creation for Note taking
bind-key h split-window -h "vim ~/Documents/notes.md"

# Tmux-sessionizer (https://github.com/ThePrimeagen/tmux-sessionizer/tree/master)
bind-key -r f run-shell "tmux neww ~/.config/tmux/bin/tmux-sessionizer.sh"
# bind-key -r M-h run-shell "tmux neww tmux-sessionizer -s 0"
# bind-key -r M-t run-shell "tmux neww tmux-sessionizer -s 1"
# bind-key -r M-n run-shell "tmux neww tmux-sessionizer -s 2"
# bind-key -r M-s run-shell "tmux neww tmux-sessionizer -s 3"

# Bindings for Closing
bind-key -r Q run-shell "tmux kill-server"
bind-key -r q run-shell "tmux kill-session -t \"$(tmux display-message -p '#S')\""
bind-key -r w run-shell "tmux kill-window"
bind-key -r x run-shell "tmux kill-pane"

# Colours follow the desktop theme, through the same current-theme symlink every other
# themed app reads. -q so a theme that ships no tmux.conf leaves tmux at its defaults
# instead of erroring on every source-file.
source-file -q ~/.config/desktop/current/theme/tmux.conf

# The tokyo-night-tmux plugin below is left uninstalled on purpose: it draws its own
# status bar in fixed colours, which would override the theme file above the moment TPM
# fetched it. Its options are kept here, commented, in case that trade is ever wanted.
# set -g @tokyo-night-tmux_window_id_style none
# set -g @tokyo-night-tmux_show_datetime 0
# set -g @tokyo-night-tmux_show_path 1
# set -g @tokyo-night-tmux_path_format relative # 'relative' or 'full'

# Reload the tmux config.
bind-key r source-file "~/.config/tmux/tmux.conf" \; display "TMUX Reloaded!"

# -----------------------------------------------------------------------------
# Plugin Manager - https://github.com/tmux-plugins/tpm
#   Step 1) git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
#   Step 2) Reload tmux if it's already started with `r
#   Step 3) Launch tmux and hit `I (capital i) to fetch any plugins
# -----------------------------------------------------------------------------

# List of plugins.
set -g @plugin "tmux-plugins/tpm"
# set -g @plugin "janoamaral/tokyo-night-tmux" # https://github.com/janoamaral/tokyo-night-tmux
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-yank"

set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-dir '~/.config/tmux/resurrect'

# Initialize TPM (keep this line at the very bottom of your tmux.conf).
run "~/.config/tmux/plugins/tpm/tpm"
