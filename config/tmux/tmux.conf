# https://builtin.com/articles/tmux-config

# Changing the Default Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable full mouse support.
set -g mouse on

# Let what runs in a pane set the clipboard, and pass it on to the terminal. The default,
# external, only does that for tmux's own copies -- and an AI column is a tmux client in a
# pane, so a selection made in one of its tabs is offered to the outer tmux as exactly the
# kind of request external throws away: the drag highlighted, and nothing was copied. It
# is also how the agents' own copy commands reach the clipboard from inside tmux.
set -s set-clipboard on

# Blinking cursor in tmux
set -g cursor-style blinking-bar

# Increase History
set-option -g history-limit 5000

# Set Default Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Set Default SHELL
set-option -g default-shell /usr/bin/fish
set-option -g default-command /usr/bin/fish

# Zero-out escape time delay
set -s escape-time 0

# Don't exit from tmux when closing a session 
set -g detach-on-destroy off

# Status bar
set -g status on                 # Enable status bar
set -g status-position top       # Set status bar on top
set -g status-interval 5         # Update status bar every 5 seconds

# Layout. Colours live in the theme file sourced at the bottom of this config; what
# each field contains is the same whichever theme is active.
set -g status-left-length 50
set -g status-right-length 70
# The session, and the task when the AI column of this window is on a tab working in a
# worktree: " desktop · fix-runner ". The column's own bar names that tab too, but down in
# a corner, and the editor beside it is still in the repository -- so the bar you read
# first says whose answers you are looking at. @task is the window's, kept by
# desktop-agent-tabs: a tab is a window of another session, which no format here can see.
set -g status-left " #S#{?@task, · #{b:@task},} "
# Agents across every session, not just this one's tabs: "● 1 waiting · 2 working", and
# nothing when nothing is going on. prefix + g lists them, and jumps.
set -g status-right " #{?client_prefix,^A ,}#(desktop-agent-sessions --tmux-status)%H:%M  %d %b "
# A coding agent's state on its window's tab, set by desktop-agent-state from Claude Code's
# hooks: waiting on you, working, or done and not yet looked at. Agents run in windows
# nobody is watching, and this is the one place the state is visible while you work in
# another. The colours are the theme's; the tab you are on shows the mark without them,
# since its background is the accent already.
set -g @agent-tab "#{?#{==:#{@agent_state},waiting},#[fg=#{@agent-waiting-colour}]● #[default],#{?#{==:#{@agent_state},done},#[fg=#{@agent-done-colour}]✓ #[default],#{?#{==:#{@agent_state},working},· ,}}}"
set -g @agent-tab-current "#{?#{==:#{@agent_state},waiting},● ,#{?#{==:#{@agent_state},done},✓ ,#{?#{==:#{@agent_state},working},· ,}}}"
# The tabs of an AI column take the colour of the model they belong to, so the bar says
# which set of tabs the column is on without reading it: the text of a tab in the
# background, the fill of the one on top. Only there -- @ai_group is the option
# desktop-agent-tabs marks those sessions with, and every other tab keeps the theme's own
# style. The colours are the theme's. Text is coloured a second time after the mark,
# because the mark ends in #[default] and that puts the tab back to its plain style.
set -g @agent-tab-colour "#{?#{==:#{@ai_model},claude},#{@agent-claude-colour},#{?#{==:#{@ai_model},codex},#{@agent-codex-colour},#{@agent-opencode-colour}}}"
set -g @agent-tab-fg "#{?@ai_group,#[fg=#{E:@agent-tab-colour}],}"
set -g @agent-tab-bg "#{?@ai_group,#[bg=#{E:@agent-tab-colour}],}"
#
# Nor do they carry a name. Every tab of a column would say the same thing -- the model --
# so the column says it once, on the bar across its top, and a tab is its number and its
# mark: "1 2 3".
# The exception is a tab working in a worktree of its own: that one says which task it is,
# since nothing else on the screen would.
set -g @agent-tab-name "#{?@ai_group,#{?@worktree,#{b:@worktree} ,},#W#{?window_flags,#{window_flags}, } }"
setw -g window-status-format "#{E:@agent-tab-fg} #I #{E:@agent-tab}#{E:@agent-tab-fg}#{E:@agent-tab-name}"
setw -g window-status-current-format "#{E:@agent-tab-bg} #I #{E:@agent-tab-current}#{E:@agent-tab-name}"

# The bar across the top of an AI column: the model in its colour, where the agent in the
# tab on top is working -- the task, for a tab in a worktree, and the directory otherwise --
# and on the right what that model has burned on this machine, today and in the five hours
# a limit is counted over. It is the pane's top border, which only the tabs of a column
# have: desktop-agent-tabs turns it on for each, because a session's status line can be at
# the top or the bottom and the tabs already have the bottom.
set -g pane-border-format "#[fg=#{E:@agent-tab-colour},bold] #{@ai_model} #[default]#{?@worktree,#{b:@worktree},#{b:pane_start_path}} #[align=right] #(desktop-agent-tokens --tmux-status --agent #{@ai_model}) "

# "Done" means done and not yet seen, so arriving at the window clears it -- by switching to
# the window, to the session it is in, or back to the terminal while it is already showing.
# That last one needs focus-events, set above.
set-hook -g session-window-changed 'if -F "#{==:#{@agent_state},done}" "set -wu @agent_state"'
set-hook -g client-session-changed 'if -F "#{==:#{@agent_state},done}" "set -wu @agent_state"'
set-hook -g client-focus-in 'if -F "#{==:#{@agent_state},done}" "set -wu @agent_state"'
# The same three arrivals are when the tab on top of a column may have changed -- a click
# on its bar, prefix + Tab, another model -- and with it the task the top bar names.
set-hook -g session-window-changed[1] 'run-shell -b "desktop-agent-tabs task"'
set-hook -g client-session-changed[1] 'run-shell -b "desktop-agent-tabs task"'
setw -g window-status-separator ""

# Focus events enabled for terminals that support them
set -g focus-events on
# Super useful when using "grouped sessions" and multi-monitor setup 
setw -g aggressive-resize on

# Jump to a Marked Pane
bind \` switch-client -t'{marked}'

# Numbering Windows and Panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Intuitive Split Commands
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

# Swapping windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Binding for new custom session. The leading space puts the prompt on the same column as
# the session name in status-left, which is inset by one; without it the prompt starts
# hard against the left edge and reads as misaligned with the rest of the bar. tmux adds
# the space between the prompt and what you type, so do not add a trailing one.
bind-key n command-prompt -p " Session name:" "new-session -s '%%'"
# Binding for new window keeping current path
bind c new-window -c "#{pane_current_path}"

# prefix + s lists the sessions you work in. The ones behind an AI column are not those:
# each is one window's tabs, and switching a client to one would put a second client on a
# session thirty columns wide and squeeze both. They are told apart by the option
# desktop-agent-tabs marks them with, and have prefix + S to themselves -- every column,
# its models and their tabs, going to the chosen tab through its column.
#
# Both are menus, not choose-tree with a filter. choose-tree asks its filter of panes, and
# since tmux 3.7 a window of several panes stays listed when none of them match, so
# neither half could be trusted to leave the other out.
bind-key s run-shell "desktop-agent-tabs pick '#{client_name}' sessions"
bind-key S run-shell "desktop-agent-tabs pick '#{client_name}' tabs"

# Toggling Windows and Sessions
bind Space last-window
bind-key C-Space switch-client -l
bind -n C-Left previous-window
bind -n C-Right next-window

# Resizing
bind -r C-j resize-pane -D 15
bind -r C-k resize-pane -U 15
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

# Breaking and Joining Panes
bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -s "%%"'

# Quick Pane Creation for Note taking
bind-key h split-window -h "vim ~/Documents/notes.md"

# The AI column of an agent window holds a tmux client of its own, so it has tabs: one
# agent to a tab, a real status line to click, and a set of tabs per model. prefix + a
# and prefix + A move between the models; these two work within one.
bind-key Tab run-shell "desktop-agent-tabs tab '#{pane_id}' next"
bind-key BTab run-shell "desktop-agent-tabs tab '#{pane_id}' previous"
bind-key t run-shell "desktop-agent-tabs new '#{pane_id}'"

# prefix + t is another agent on the same files, which is right for a second opinion and
# wrong for a second change: two agents editing one checkout overwrite each other, and each
# runs the tests against the other's half-finished work. prefix + T is the tab for that --
# a branch name, and the new tab's agent works in a worktree of its own while the editor
# and the shell stay where they are. In a window with no column to put a tab in, the task
# gets a window instead.
bind-key T command-prompt -p " Task branch:" "run-shell \"cd '#{pane_current_path}' && DESKTOP_WORKTREE_CLIENT='#{client_name}' desktop-worktree new --tab '#{pane_id}' '%%' >/dev/null\""

# Scrolling back by keyboard, with the focus in the column. The pane there is a tmux
# client on its alternate screen and has no history at all -- the conversation is in the
# tab it shows -- so copy mode has to be entered one level down. The keys that follow get
# there on their own: the outer tmux only keeps the prefix. The wheel never needed this;
# it is passed down as a mouse event and the inner tmux scrolls the tab.
bind-key [ if-shell -F "#{@ai_column}" { run-shell "desktop-agent-tabs scroll '#{pane_id}'" } { copy-mode }
bind-key PPage if-shell -F "#{@ai_column}" { run-shell "desktop-agent-tabs scroll '#{pane_id}' -u" } { copy-mode -u }

# Those sessions are named after the window whose column they belong to, and tmux has no
# reason of its own to remove them, so the window closing is when they go.
set-hook -g window-unlinked 'run-shell -b "desktop-agent-tabs gc; desktop-agent-tabs task"'
set-hook -g session-closed 'run-shell -b "desktop-agent-tabs gc"'

# Change the agent: `a` walks claude -> opencode -> codex, `A` picks one straight away.
# In a window with an AI column that moves its client to the model's own set of tabs, so
# each model keeps what it had open; in a window with a plain agent pane it respawns that
# pane, so the window keeps its shape and only one agent is running. claude is resumed
# with --continue when it has something to resume. Both work with the focus anywhere in
# the window, which matters because it is normally in the editor.
bind-key a run-shell "desktop-agent-swap '#{pane_id}'"
bind-key A display-menu -T " Agent " -x P -y P \
  "claude"   c "run-shell \"desktop-agent-swap '#{pane_id}' claude\"" \
  "opencode" o "run-shell \"desktop-agent-swap '#{pane_id}' opencode\"" \
  "codex"    x "run-shell \"desktop-agent-swap '#{pane_id}' codex\"" \
  "" \
  "all agents" g "display-popup -E -w 90% -h 40% -T ' Agents ' 'desktop-agent-sessions --pick'"

# Every agent on this machine, needing you first, in a popup: Enter jumps to its pane, in
# whichever session it is. What herdr keeps as a sidebar, without the column it costs in
# every window.
bind-key g display-popup -E -w 90% -h 40% -T " Agents " "desktop-agent-sessions --pick"

# And the sidebar itself, for when they are worth the column: every session with its
# windows and its agents down the left, click to go there. On or off for every window at
# once, since a pane lives in one window and a single column would vanish the moment it
# was used. q inside it closes them all again, as this key does.
bind-key e run-shell "desktop-tmux-sidebar --toggle"

# Tmux-sessionizer (https://github.com/ThePrimeagen/tmux-sessionizer/tree/master)
bind-key -r f run-shell "tmux neww ~/.config/tmux/bin/tmux-sessionizer.sh"
# bind-key -r M-h run-shell "tmux neww tmux-sessionizer -s 0"
# bind-key -r M-t run-shell "tmux neww tmux-sessionizer -s 1"
# bind-key -r M-n run-shell "tmux neww tmux-sessionizer -s 2"
# bind-key -r M-s run-shell "tmux neww tmux-sessionizer -s 3"

# Bindings for Closing
bind-key -r Q run-shell "tmux kill-server"
bind-key -r q run-shell "tmux kill-session -t \"$(tmux display-message -p '#S')\""
bind-key -r w run-shell "tmux kill-window"
bind-key -r x run-shell "tmux kill-pane"

# Colours follow the desktop theme, through the same current-theme symlink every other
# themed app reads. -q so a theme that ships no tmux.conf leaves tmux at its defaults
# instead of erroring on every source-file.
source-file -q ~/.config/desktop/current/theme/tmux.conf

# The tokyo-night-tmux plugin below is left uninstalled on purpose: it draws its own
# status bar in fixed colours, which would override the theme file above the moment TPM
# fetched it. Its options are kept here, commented, in case that trade is ever wanted.
# set -g @tokyo-night-tmux_window_id_style none
# set -g @tokyo-night-tmux_show_datetime 0
# set -g @tokyo-night-tmux_show_path 1
# set -g @tokyo-night-tmux_path_format relative # 'relative' or 'full'

# Reload the tmux config.
bind-key r source-file "~/.config/tmux/tmux.conf" \; display " TMUX Reloaded!"

# -----------------------------------------------------------------------------
# Plugin Manager - https://github.com/tmux-plugins/tpm
#   Step 1) git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
#   Step 2) Reload tmux if it's already started with `r
#   Step 3) Launch tmux and hit `I (capital i) to fetch any plugins
# -----------------------------------------------------------------------------

# List of plugins.
set -g @plugin "tmux-plugins/tpm"
# set -g @plugin "janoamaral/tokyo-night-tmux" # https://github.com/janoamaral/tokyo-night-tmux
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-yank"

set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-dir '~/.config/tmux/resurrect'

# Initialize TPM (keep this line at the very bottom of your tmux.conf).
run "~/.config/tmux/plugins/tpm/tpm"
