# Add custom window config in this file.

# KeePassXC and Obsidian are placed by their window's class. Obsidian is an AppImage and
# re-execs into its own systemd scope, so the process Hyprland spawns is not the one that
# ends up owning the window and an exec rule has nothing to match. desktop-workspace-start
# places them at login; the class keeps them there when opened later.
windowrule = workspace 4 silent, match:class ^(org\.keepassxc\.KeePassXC)$
windowrule = workspace 5 silent, match:class ^(md\.obsidian\.Obsidian)$

# The polkit agent's dialog maps floating but never asks for focus, and it does not
# always land on the workspace you are looking at -- it opened on workspace 2 while the
# focus sat on workspace 3, so no keystroke ever reached the password field and the
# Authenticate button stayed disabled. Pinning makes it follow you to the visible
# workspace; stayfocused is what actually hands it the keyboard.
windowrule = float true, match:class ^(hyprpolkitagent)$
windowrule = center true, match:class ^(hyprpolkitagent)$
windowrule = pin true, match:class ^(hyprpolkitagent)$
windowrule = stay_focused true, match:class ^(hyprpolkitagent)$
