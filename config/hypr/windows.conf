# Add custom window config in this file.

# KeePassXC and Obsidian are AppImages, and each re-execs into its own systemd scope:
# the process Hyprland spawns is not the one that ends up owning the window, so the
# `[workspace N silent]` exec rules in autostart.conf have nothing to match and the
# windows land wherever the pointer happened to be. Matching the window's own class
# instead is what makes the placement survive a re-login.
windowrule = workspace 4 silent, class:^(org\.keepassxc\.KeePassXC)$
windowrule = workspace 5 silent, class:^(md\.obsidian\.Obsidian)$

# The polkit agent's dialog maps floating but never asks for focus, and it does not
# always land on the workspace you are looking at -- it opened on workspace 2 while the
# focus sat on workspace 3, so no keystroke ever reached the password field and the
# Authenticate button stayed disabled. Pinning makes it follow you to the visible
# workspace; stayfocused is what actually hands it the keyboard.
windowrule = float, class:^(hyprpolkitagent)$
windowrule = center, class:^(hyprpolkitagent)$
windowrule = pin, class:^(hyprpolkitagent)$
windowrule = stayfocused, class:^(hyprpolkitagent)$
