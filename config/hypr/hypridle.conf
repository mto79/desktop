general {
    lock_cmd = desktop-lock-screen                         # lock screen and 1password
    before_sleep_cmd = loginctl lock-session               # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on             # to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# The three run in order and the order matters: the screensaver is skipped while
# hyprlock is up, so a screensaver timeout at or past the lock's would never fire at all.
# Keep screensaver < lock < dpms off.

listener {
    timeout = 900                                             # 15min
    on-timeout = pidof hyprlock || desktop-launch-screensaver # start screensaver (if we haven't locked already)
}

listener {
    timeout = 1050                     # 17.5min
    on-timeout = loginctl lock-session # lock screen when timeout has passed
}

listener {
    timeout = 1080                                           # 18min
    on-timeout = hyprctl dispatch dpms off                   # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r # screen on when activity is detected
}
