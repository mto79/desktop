# Extra autostart processes
# exec-once = uwsm app -- my-service

# start nm-applet at login
exec-once = nm-applet

# Workspace 3 belongs on the widest screen here; pin it before anything opens on it.
exec-once = desktop-workspace-pin

# Starting workspaces. The two AppImages are placed by class in windows.conf rather
# than with a [workspace N] rule here -- see the note in that file.
exec-once = [workspace 1 silent] ghostty -e yazi
exec-once = [workspace 2 silent] brave-browser
exec-once = [workspace 3 silent] ghostty -e tmux new-session -A -s home
exec-once = $passwordmanager
exec-once = ~/.local/bin/Obsidian.AppImage

# Land on the terminal once the rest has been dispatched.
exec-once = hyprctl dispatch workspace 3
