# Video decoded on a GPU rather than the CPU, wherever mpv knows that to work. On this laptop
# that is the NVIDIA card (nvdec): a 1080p clip took 0.40 s of CPU against 1.71 s in
# software. It wakes the dGPU while a video plays; hwdec=vaapi would keep it on the Intel
# GPU at 1.01 s instead.
hwdec=auto-safe
