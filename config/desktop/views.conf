# The sidebar's VIEWS: sessions that show something rather than hold a repository's work.
# One per line, a name and the command its session runs. Opened from the sidebar, or with
# `desktop-view`; the session is named after the view, and gone to if it is already open.
#
# desktop-view watch <seconds> <command> runs a command again every so many seconds.

reviews   desktop-view watch 300 desktop-reviews --list
update    desktop-update
system    btop
journal   journalctl --user --follow --lines 100 --priority warning
