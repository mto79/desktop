# Define terminal tag to style them uniformly
windowrule = tag +terminal, match:class (com.mitchellh.ghostty)

# The agent console, SUPER + ~ (desktop-agent-console): on a special workspace of its
# own, so it appears over whatever workspace is showing and hides without stopping.
# Floating, wide and short, hanging from the top of the screen.
windowrule = workspace special:console, match:class ^(com\.mitchellh\.ghostty)$, match:initial_title ^(Console)$
windowrule = float true, match:class ^(com\.mitchellh\.ghostty)$, match:initial_title ^(Console)$
windowrule = size monitor_w*0.8 monitor_h*0.6, match:class ^(com\.mitchellh\.ghostty)$, match:initial_title ^(Console)$
windowrule = move monitor_w*0.1 monitor_h*0.04, match:class ^(com\.mitchellh\.ghostty)$, match:initial_title ^(Console)$
