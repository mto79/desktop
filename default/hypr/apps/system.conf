# Floating windows
windowrule = float true, match:tag floating-window
windowrule = center true, match:tag floating-window
windowrule = size 800 600, match:tag floating-window

# Real applications, matched on their own class.
windowrule = tag +floating-window, match:class (org.gnome.NautilusPreviewer|com.gabm.satty)

# TUIs the desktop opens in a terminal. Ghostty cannot set a Wayland app id -- every
# window it opens is com.mitchellh.ghostty -- so these are matched on the title each
# launcher passes with --title instead. Scoped to ghostty's class as well, or any
# window that happened to be called "Desktop" would start floating.
windowrule = tag +floating-window, match:class ^(com\.mitchellh\.ghostty)$, match:title ^(Agent .*|Bluetui|Gdu|Impala|Wiremix|Desktop|About|TUI\.float)$
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files)
windowrule = float true, match:class org.gnome.Calculator

# Fullscreen screensaver
windowrule = fullscreen true, match:class ^(com\.mitchellh\.ghostty)$, match:title ^(org\.desktop\.screensaver)$
windowrule = float true, match:class ^(com\.mitchellh\.ghostty)$, match:title ^(org\.desktop\.screensaver)$

# No transparency on media windows
windowrule = opacity 1 1, match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$
