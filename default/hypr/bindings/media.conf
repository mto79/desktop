# Laptop multimedia keys for volume and LCD brightness.
#
# No notify-send here any more: the shell's OSD watches PipeWire, so volume and mute
# draw themselves however they were changed -- a key, the audio panel, a scroll on the
# bar, another application. Brightness has no such bus, so it says so over IPC, and
# falls back to a notification when the shell is not running.
bindld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 0.05+
bindld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindld = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl set +5% && { desktop-shell shell osd brightness >/dev/null 2>&1 || notify-send -h string:x-canonical-private-synchronous:brightness -u low -t 2000 "Brightness" "$(brightnessctl -m | cut -d, -f4)"; }
bindld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%- && { desktop-shell shell osd brightness >/dev/null 2>&1 || notify-send -h string:x-canonical-private-synchronous:brightness -u low -t 2000 "Brightness" "$(brightnessctl -m | cut -d, -f4)"; }

# Requires playerctl
bindld = , XF86AudioPlay, Play, exec, playerctl play-pause
bindld = , XF86AudioPause, Pause, exec, playerctl pause
bindld = , XF86AudioNext, Next, exec, playerctl next
bindld = , XF86AudioPrev, Previous, exec, playerctl previous

# Switch audio output with Super + Mute
bindld = SUPER, XF86AudioMute, Switch audio output, exec, desktop-cmd-audio-switch
