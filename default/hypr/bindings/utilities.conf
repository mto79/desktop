# Menus
#bindd = SUPER, SPACE, Launch apps, exec, walker -p "Start…"
bindd = SUPER, SPACE, Launch apps, exec, desktop-shell shell toggleLauncher >/dev/null 2>&1 || desktop-menu apps
#bindd = SUPER CTRL, E, Emoji picker, exec, walker -m Emojis
bindd = SUPER ALT, SPACE, desktop menu, exec, desktop-menu
bindd = SUPER, ESCAPE, Power menu, exec, desktop-menu system
bindld = , XF86PowerOff, Power menu, exec, desktop-menu system
bindd = SUPER, K, Show key bindings, exec, desktop-menu-keybindings
bindd = SUPER, M, Monitor layout, exec, desktop-menu monitors
bindd = SUPER, A, Ask an agent, exec, desktop-agent-prompt
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, desktop-toggle-bar
bindd = SUPER CTRL, SPACE, Next background in theme, exec, desktop-theme-bg-next
bindd = SUPER SHIFT CTRL, SPACE, Pick new theme, exec, desktop-menu theme
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, desktop-shell shell dismissNotification >/dev/null 2>&1 || makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, desktop-shell shell clearNotifications >/dev/null 2>&1 || makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, desktop-shell shell toggleDoNotDisturb >/dev/null 2>&1 || makoctl mode -t do-not-disturb

# Toggle idling
bindd = SUPER CTRL, I, Toggle locking on idle, exec, desktop-toggle-idle

# Toggle nightlight
bindd = SUPER CTRL, N, Toggle nightlight, exec, desktop-toggle-nightlight

# Screenshots
bindd = , PRINT, Screenshot of region, exec, desktop-cmd-screenshot
bindd = SHIFT, PRINT, Screenshot of window, exec, desktop-cmd-screenshot window
bindd = CTRL, PRINT, Screenshot of display, exec, desktop-cmd-screenshot output

# Screen recordings
bindd = ALT, PRINT, Screen record a region, exec, desktop-cmd-screenrecord region
bindd = ALT SHIFT, PRINT, Screen record a region with audio, exec, desktop-cmd-screenrecord region audio
bindd = CTRL ALT, PRINT, Screen record display, exec, desktop-cmd-screenrecord output
bindd = CTRL ALT SHIFT, PRINT, Screen record display with audio, exec, desktop-cmd-screenrecord output audio

# Color picker
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Waybar-less information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send "$(desktop-battery-status)"


# Shell panels. SUPER+D, then one letter.
#
# A submap rather than seven chords because the free key space does not allow seven
# guessable ones: SUPER+B is the browser, SUPER ALT+C is ChatGPT, SUPER ALT+M is
# Mattermost, SUPER CTRL+N is the nightlight. A flat scheme would have handed three of
# these a letter nobody would think of. In here every mnemonic is the real first letter.
#
# The closing `submap = reset` is not optional. Thirteen more files are sourced after
# this one, and submap state is carried by the parser, so leaving it open would put every
# binding in all of them inside this submap.
bindd = SUPER, D, Panels, submap, panels
submap = panels

bindd = , A, Audio panel, exec, desktop-shell shell togglePanel audio
bind = , A, submap, reset
bindd = , B, Bluetooth panel, exec, desktop-shell shell togglePanel bluetooth
bind = , B, submap, reset
bindd = , C, CPU panel, exec, desktop-shell shell togglePanel cpu
bind = , C, submap, reset
bindd = , D, Calendar panel, exec, desktop-shell shell togglePanel calendar
bind = , D, submap, reset
bindd = , M, Memory panel, exec, desktop-shell shell togglePanel memory
bind = , M, submap, reset
bindd = , N, Network panel, exec, desktop-shell shell togglePanel network
bind = , N, submap, reset
bindd = , P, Media panel, exec, desktop-shell shell togglePanel media
bind = , P, submap, reset

# Any other key leaves, so a mistyped letter cannot strand you in a mode where the
# keyboard appears to do nothing.
bind = , escape, submap, reset
bind = , catchall, submap, reset

submap = reset
