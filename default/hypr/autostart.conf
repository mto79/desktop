exec-once = uwsm app -- hypridle
# Replaced by the shell's own notification server; one process owns the bus name, and
# desktop-launch-shell starts mako again if the shell will not stay up.
#exec-once = uwsm app -- mako
# Replaced by the Quickshell desktop shell; kept as a fallback (see desktop-launch-shell).
#exec-once = uwsm app -- waybar
exec-once = uwsm app -- desktop-launch-shell
exec-once = uwsm app -- fcitx5
# The wallpaper, filling each screen or fitting it as its shape needs (desktop-wallpaper).
exec-once = desktop-wallpaper
#exec-once = uwsm app -- swayosd-server
exec-once = systemctl --user enable --now hyprpolkitagent.service

# Screens come and go -- docking at a desk, unplugging to leave -- and the layout should
# follow them without being asked. SUPER+M stays the way to overrule the choice, not the
# way to make it. Applies the matching layout once at login too.
exec-once = uwsm app -- desktop-monitors-watch
# A message, shown and said, on joining a Wi-Fi network named in wifi.conf.
exec-once = uwsm app -- desktop-wifi-watch

# Clipboard history: keeps what is copied, text and images, so SUPER+V can offer it again.
# Leaves alone whatever a password manager copies -- see desktop-clipboard.
exec-once = uwsm app -- desktop-clipboard watch

# The home group of web GUIs, ready on workspace 1 (desktop-guis; nothing when
# ~/.config/desktop/guis.conf has no [home] links).
exec-once = desktop-guis open home
