# The bar's equalizer: cava reading what PipeWire plays and printing one line per frame,
# the bars as numbers from 0 to 1000 separated by semicolons. Read by
# shell/Commons/Spectrum.qml, which starts cava only while something is playing.
#
# Mono, so the bars run bass to treble left to right rather than mirrored per channel.

[general]
framerate = 30
bars = 12
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

# pulse rather than pipewire: Fedora builds cava without its PipeWire input, and with
# that method it exits on reading this file. PipeWire answers as Pulse all the same.
[input]
method = pulse
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
