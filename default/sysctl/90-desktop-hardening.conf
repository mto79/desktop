# Kernel settings Fedora leaves open for debugging tools. Installed by
# install/config/security.sh; desktop-security checks them.

# A process may trace -- read and write the memory of -- only its own children. With 0, any
# program of yours could read any other: the browser's session cookies, KeePassXC's unlocked
# database, the SSH agent's keys. `gdb ./prog` and `strace cmd` still work; attaching to a
# process already running (`gdb -p`, `strace -p`, py-spy) now needs sudo.
kernel.yama.ptrace_scope = 1

# Kernel addresses hidden from anything without CAP_SYSLOG. They are the map an exploit
# needs around address randomisation; `perf` run as yourself loses kernel symbols.
kernel.kptr_restrict = 1
