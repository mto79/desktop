# Weston, which draws the SDDM login screen (weston --shell=kiosk), started with this file
# by default/sddm/weston.conf.
#
# A touchpad's tap-to-click is off unless something turns it on. Hyprland does, so a tap
# clicks once you are logged in; Weston did not, so at the login screen a tap on the
# button did nothing and it looked as if the mouse could not click it -- only pressing the
# touchpad down until it clicked worked.
[libinput]
enable-tap=true
